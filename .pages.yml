settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: add {path}"
      update: "content: update {path}"
      delete: "content: remove {path}"
      rename: "content: rename {oldPath} to {newPath}"

media:
  - name: project-images
    label: Project images
    input: public/images/portfolio
    output: /images/portfolio
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
  - name: hero-videos
    label: Hero videos
    input: public/videos/hero
    output: /videos/hero
    categories: [video]
    extensions: [mp4, webm]
    rename: safe
  - name: project-videos
    label: Project videos
    input: public/videos/portfolio
    output: /videos/portfolio
    categories: [video]
    extensions: [mp4, webm]
    rename: safe

components:
  seo:
    type: object
    label: Search & sharing
    description: Controls the title and description shown in search results and shared links.
    fields:
      - name: title
        label: Page title
        type: string
        required: true
        description: Aim for 50–60 characters.
        options:
          maxlength: 65
      - name: description
        label: Page description
        type: text
        required: true
        description: Aim for 140–160 characters.
        options:
          maxlength: 170
  cta:
    type: object
    label: Call to action
    fields:
      - { name: label, label: Eyebrow, type: string, required: true }
      - { name: heading, label: Heading, type: string, required: true }
      - { name: buttonLabel, label: Button label, type: string, required: true }

content:
  - name: site
    label: Site settings
    type: group
    items:
      - name: site-settings
        label: Brand, navigation & SEO
        type: file
        path: data/site.json
        format: json
        fields:
          - { name: brandName, label: Brand name, type: string, required: true }
          - { name: serviceLine, label: Service line, type: string, required: true }
          - name: nav
            label: Navigation labels
            type: object
            fields:
              - { name: work, label: Work, type: string, required: true }
              - { name: services, label: Services, type: string, required: true }
              - { name: about, label: About, type: string, required: true }
              - { name: contact, label: Contact action, type: string, required: true }
          - name: footer
            label: Footer
            type: object
            fields:
              - { name: descriptor, label: Descriptor, type: string, required: true }
              - { name: copyright, label: Copyright, type: string, required: true }
          - name: seo
            component: seo
      - name: contact
        label: Contact details
        type: file
        path: data/contact.json
        format: json
        fields:
          - { name: email, label: Studio email, type: string, required: true }
          - name: whatsappNumber
            label: WhatsApp number
            type: string
            required: true
            description: Country code and digits only, without + or spaces.
            pattern:
              regex: "^[0-9]{8,15}$"
              message: Use 8–15 digits only.
          - { name: phoneDisplay, label: Display phone number, type: string, required: true }
          - { name: address, label: Studio address, type: string, required: true }
          - { name: instagramUsername, label: Instagram username, type: string, description: Enter without @. }
          - { name: telegramUsername, label: Telegram username, type: string, description: Enter without @. }

  - name: homepage
    label: Homepage
    type: group
    items:
      - name: hero-settings
        label: 1 · Hero display & fallback
        type: file
        path: data/hero.json
        format: json
        fields:
          - name: mode
            label: Active hero format
            type: select
            required: true
            default: single
            description: Choose the format shown on the homepage, then edit its dedicated panel below.
            options:
              values:
                - { label: Single image, value: single }
                - { label: Slideshow, value: slideshow }
                - { label: Video, value: video }
          - name: image
            label: Main image / safety fallback
            type: image
            required: true
            description: Used for Single image mode and as the fallback if a video cannot load.
            options:
              media: project-images
              categories: [image]
              extensions: [jpg, jpeg, png, webp, avif]
          - { name: alt, label: Main image description, type: string, required: true }
      - name: hero-video
        label: 2 · Hero video
        type: file
        path: data/hero-video.json
        format: json
        fields:
          - name: video
            label: Video file
            type: file
            required: true
            description: Upload an MP4 or WebM file. To show it, select Video in “Hero display & fallback”.
            options:
              media: hero-videos
              categories: [video]
              extensions: [mp4, webm]
              rename: safe
          - name: videoPoster
            label: Loading poster
            type: image
            required: true
            description: A still image shown while the video loads or when autoplay is unavailable.
            options:
              media: project-images
              categories: [image]
              extensions: [jpg, jpeg, png, webp, avif]
          - { name: videoAlt, label: Video description, type: string, required: true, description: Describe the visible scene for accessibility. }
      - name: hero-slideshow
        label: 3 · Hero slideshow
        type: file
        path: data/hero-slides.json
        format: json
        fields:
          - name: slides
            label: Slides
            type: object
            description: To show these slides, select Slideshow in “Hero display & fallback”.
            list:
              collapsible: true
              summary: "{fields.alt}"
              min: 1
              max: 8
            fields:
              - name: mediaType
                label: Media type
                type: select
                default: image
                options:
                  values:
                    - { label: Image, value: image }
                    - { label: Video, value: video }
              - name: image
                label: Image
                type: image
                options:
                  media: project-images
              - name: video
                label: Video
                type: file
                options:
                  media: hero-videos
                  categories: [video]
                  extensions: [mp4, webm]
              - name: videoPoster
                label: Video poster
                type: image
                options:
                  media: project-images
              - { name: alt, label: Alt text or description, type: string, required: true }
      - name: homepage-copy
        label: Homepage sections
        type: file
        path: data/home.json
        format: json
        fields:
          - name: hero
            label: Hero copy
            type: object
            fields:
              - { name: serviceLine, label: Service line, type: string, required: true }
              - { name: locationLine, label: Location line, type: string, required: true }
              - { name: lineOne, label: Heading line 1, type: string, required: true }
              - { name: lineTwo, label: Heading line 2, type: string, required: true }
              - name: rotatingWords
                label: Rotating final words
                type: string
                required: true
                list:
                  min: 4
                  max: 4
                description: Include punctuation exactly as it should appear.
              - { name: description, label: Introduction, type: text, required: true }
              - { name: workLinkLabel, label: Work link, type: string, required: true }
              - { name: contactLabel, label: Contact action, type: string, required: true }
          - name: manifesto
            label: Manifesto
            type: object
            fields:
              - { name: label, label: Section label, type: string, required: true }
              - { name: statement, label: Statement, type: text, required: true }
          - name: showcase
            label: Featured showcase
            type: object
            fields:
              - { name: label, label: Section label, type: string, required: true }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: headingEmphasis, label: Emphasized heading, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - { name: portfolioLinkLabel, label: Portfolio link, type: string, required: true }
              - name: featured
                label: Featured card
                type: object
                fields:
                  - name: image
                    label: Image
                    type: image
                    required: true
                    options:
                      media: project-images
                  - { name: alt, label: Image alt text, type: string, required: true }
                  - { name: badge, label: Badge, type: string, required: true }
                  - { name: linkLabel, label: Card link, type: string, required: true }
                  - { name: title, label: Title, type: string, required: true }
                  - { name: category, label: Category line, type: string, required: true }
                  - { name: location, label: Location line, type: string, required: true }
          - name: outcomes
            label: Project outcomes
            type: object
            fields:
              - { name: label, label: Section label, type: string, required: true }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: headingEmphasis, label: Emphasized heading, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - name: items
                label: Outcomes
                type: object
                list:
                  collapsible: true
                  summary: "{fields.label} — {fields.title}"
                  min: 3
                  max: 3
                fields:
                  - { name: label, label: Short label, type: string, required: true }
                  - { name: title, label: Title, type: string, required: true }
                  - { name: description, label: Description, type: text, required: true }
          - name: processIntro
            label: Process story
            type: object
            fields:
              - { name: label, label: Section label, type: string, required: true }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: headingEmphasis, label: Emphasized heading, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - name: media
                label: Process images
                type: object
                list:
                  collapsible: true
                  summary: "Scene {index}"
                  min: 4
                  max: 4
                fields:
                  - name: image
                    label: Image
                    type: image
                    required: true
                    options:
                      media: project-images
          - name: capabilities
            label: Capabilities section
            type: object
            fields:
              - { name: label, label: Section label, type: string, required: true }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: headingEmphasis, label: Emphasized heading, type: string, required: true }
              - { name: linkLabel, label: Services link, type: string, required: true }
          - name: studio
            label: Studio section
            type: object
            fields:
              - { name: label, label: Section label, type: string, required: true }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: linkLabel, label: About link, type: string, required: true }
              - { name: contactLabel, label: Contact action, type: string, required: true }
          - name: contact
            label: Contact section
            type: object
            fields:
              - { name: label, label: Section label, type: string, required: true }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: briefLabel, label: Brief label, type: string, required: true }
              - { name: briefDescription, label: Brief guidance, type: text, required: true }
              - name: briefItems
                label: Suggested brief items
                type: string
                required: true
                list:
                  min: 1
                  max: 6
              - { name: emailLinkLabel, label: Email link, type: string, required: true }
              - { name: availability, label: Availability line, type: string, required: true }

  - name: studio-services
    label: Studio & services
    type: group
    items:
      - name: about
        label: About page
        type: file
        path: data/about.json
        format: json
        fields:
          - name: seo
            component: seo
          - name: hero
            label: Hero
            type: object
            fields:
              - { name: label, label: Eyebrow, type: string, required: true }
              - { name: heading, label: Heading, type: text, required: true }
          - name: labels
            label: Section labels
            type: object
            fields:
              - { name: introduction, label: Introduction, type: string, required: true }
              - { name: process, label: Process, type: string, required: true }
          - name: intro
            label: Introduction paragraphs
            type: text
            required: true
            list:
              min: 1
              max: 4
          - name: process
            label: Process steps
            type: object
            list:
              collapsible: true
              summary: "{fields.title} — {fields.stage}"
              min: 1
              max: 6
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: stage, label: Short stage label, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
          - name: cta
            component: cta

      - name: services
        label: Services page
        type: file
        path: data/services.json
        format: json
        fields:
          - name: seo
            component: seo
          - name: hero
            label: Hero
            type: object
            fields:
              - { name: label, label: Eyebrow, type: string, required: true }
              - { name: heading, label: Heading, type: text, required: true }
          - name: intro
            label: Services introduction
            type: object
            fields:
              - { name: label, label: Section label, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - { name: enquiryLabel, label: Enquiry action, type: string, required: true }
          - name: services
            label: Services
            type: object
            list:
              collapsible: true
              summary: "{fields.title}"
              min: 1
              max: 12
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
          - { name: audienceLabel, label: Audience section label, type: string, required: true }
          - name: clientGroups
            label: Client groups
            type: object
            list:
              collapsible: true
              summary: "{fields.title}"
              min: 1
              max: 6
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
          - name: brief
            label: Brief guidance
            type: object
            fields:
              - { name: label, label: Eyebrow, type: string, required: true }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - name: items
                label: Brief items
                type: string
                required: true
                list:
                  min: 1
                  max: 6
          - name: cta
            component: cta

  - name: portfolio
    label: Portfolio
    type: group
    items:
      - name: work-page
        label: Work page copy
        type: file
        path: data/work.json
        format: json
        fields:
          - name: seo
            component: seo
          - name: hero
            label: Hero
            type: object
            fields:
              - { name: label, label: Eyebrow, type: string, required: true }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
          - name: emptyState
            label: Showreel or empty state
            type: object
            description: Shown until at least one published project exists.
            fields:
              - name: image
                label: Image
                type: image
                required: true
                options:
                  media: project-images
              - { name: imageAlt, label: Image alt text, type: string, required: true }
              - { name: label, label: Eyebrow, type: string, required: true }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: description, label: Description, type: text, required: true }
              - { name: linkLabel, label: Contact link, type: string, required: true }
      - name: projects
        label: Projects
        type: file
        path: data/portfolio.json
        format: json
        fields:
          - name: projects
            label: Project entries
            type: object
            list:
              collapsible: true
              summary: "{fields.title} — {fields.year}"
            fields:
              - name: published
                label: Published
                type: boolean
                default: false
                description: Turn on only when the entry and all media are ready.
              - name: featured
                label: Featured
                type: boolean
                default: false
                description: Featured projects appear before other published projects.
              - { name: title, label: Project title, type: string, required: true }
              - name: slug
                label: URL slug
                type: string
                required: true
                description: Lowercase letters, numbers, and hyphens only. Do not change after publishing.
                pattern:
                  regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
                  message: Use lowercase letters, numbers, and hyphens only.
              - { name: category, label: Category, type: string, required: true }
              - { name: location, label: Location, type: string, required: true }
              - name: year
                label: Year
                type: string
                required: true
                pattern:
                  regex: "^[0-9]{4}$"
                  message: Enter a four-digit year.
              - name: image
                label: Cover image
                type: image
                required: true
                options:
                  media: project-images
              - name: alt_text
                label: Cover image alt text
                type: string
                required: true
                description: Describe the visible scene for accessibility and search.
                options:
                  maxlength: 160
              - name: description
                label: Short description
                type: text
                required: true
                options:
                  maxlength: 240
              - name: write_up
                label: Project narrative
                type: text
                description: Separate paragraphs with a blank line.
              - name: gallery
                label: Project gallery
                type: object
                list:
                  collapsible: true
                  summary: "{fields.alt_text}"
                fields:
                  - name: mediaType
                    label: Media type
                    type: select
                    default: image
                    options:
                      values:
                        - { label: Image, value: image }
                        - { label: Video, value: video }
                  - name: image
                    label: Image
                    type: image
                    options:
                      media: project-images
                  - name: video
                    label: Video
                    type: file
                    options:
                      media: project-videos
                  - name: videoPoster
                    label: Video poster
                    type: image
                    options:
                      media: project-images
                  - { name: alt_text, label: Alt text or video description, type: string, required: true }
